context:
  version: "4.8.1"

package:
  name: fish
  version: ${{ version }}

source:
  url: https://github.com/fish-shell/fish-shell/releases/download/${{ version }}/fish-${{ version }}.tar.xz
  sha256: 0eb86a851e865e934a7c2091a73d7695225e78f0e00a7bb96d5f877d76c65782
  target_directory: src
  patches:
    - patches/0001-tests-test_driver.py-use-CC-for-compilation.patch

build:
  number: 1
  script: build.sh
  prefix_detection:
    ignore_binary_files: true
  skip:
    - win or ppc64le

requirements:
  build:
    - cmake
    - make
    - sphinx
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - gettext
  host:
    - ncurses
    - pcre2
    # For fish_run_tests
    - if: target_platform == "linux-64"
      then:
        - procps-ng
  run: []

tests:
  - script:
      - fish -v
      - fish_indent -v
      - test -f "$PREFIX/share/fish/man/man1/string.1"
      - fish -c 'test -f "$__fish_man_dir/man1/string.1"'
      - if command -v man >/dev/null; then MANPAGER=cat fish -c 'string -h >/dev/null'; fi
  - script:
      - python ./src/tests/test_driver.py $CONDA_PREFIX/bin ./src/tests/pexpects/abbrs.py
    requirements:
      run:
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - pexpect
    files:
      source:
        - src/tests/

about:
  homepage: https://fishshell.com
  license: GPL-2.0-only
  license_file:
    - THIRDPARTY.yml
    - src/COPYING
  summary: User-friendly command-line shell for UNIX-like operating systems
  description: |
    Fish is a smart and user-friendly command line shell for macOS, Linux, and the rest of the family.
  repository: https://github.com/fish-shell/fish-shell

extra:
  recipe-maintainers:
    - anjos
    - chrisburr
    - mdraw
